{% extends "base.html" %}

{% block title %}首頁 - 加班單辨識系統{% endblock %}

{% block content %}
<div class="upload-section">
    <h2 class="section-title">上傳加班單</h2>
    <p class="section-desc">支援 JPG、PNG、PDF 格式，可一次上傳多個檔案</p>

    <form id="upload-form" action="/upload" method="POST" enctype="multipart/form-data">
        <div class="dropzone" id="dropzone">
            <div class="dropzone-content">
                <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p class="dropzone-text">將檔案拖放至此處</p>
                <p class="dropzone-subtext">或點擊選擇檔案</p>
            </div>
            <input type="file" id="file-input" name="files" multiple accept="image/*,.pdf" hidden>
        </div>

        <div class="file-list" id="file-list">
            <h3 class="file-list-title">已選檔案 (<span id="file-count">0</span>)</h3>
            <ul class="file-list-items" id="file-list-items">
                <!-- 動態生成的檔案項目 -->
            </ul>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn" disabled>
                <span class="btn-text">開始辨識</span>
                <span class="btn-loading" hidden>
                    <span class="spinner"></span>
                    處理中...
                </span>
            </button>
        </div>
    </form>
</div>
{% endblock %}
